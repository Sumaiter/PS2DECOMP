name: Check tool and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/workspace.test.js tests/localization.test.js tests/size_range.test.js tests/review_prompt.test.js
      - run: python package_local.py
      - uses: actions/upload-artifact@v4
        with:
          name: ps2decomp-${{ matrix.os }}
          path: dist/*.vsix
